<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Drive Simulator 3D - Preview</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✨</text></svg>">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="info">
    <p class="instructions">Drag to orbit • Scroll to zoom</p>
  </div>
  <div id="loading">
    <div class="spinner"></div>
    <p>Loading car model...</p>
  </div>
  <div class="preview-title">
    <h1>Drive Simulator</h1>
    <p class="preview-desc">A web driving experience that puts you behind the wheel of a 3D car model directly in your browser. Built from scratch with Three.js</p>
  </div>
  <div class="preview-nav">
    <a href="index.html" class="nav-link">← Volver al simulador</a>
  </div>

  <canvas id="scene"></canvas>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="js/preview.js"></script>
</body>
</html>
